server:
  port: 8080
spring:
  application:
    name: vinayaka-chaviti-backend
  datasource:
    url: jdbc:mysql://localhost:3306/festival_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
jwt:
  secret: ${JWT_SECRET:vinayaka-chaviti-2027-dev-only-super-secret-signing-key-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
storage:
  base-path: ./uploads
  public-base-url: http://localhost:8080/uploads